<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aizentify · Study library</title>
<link rel="stylesheet" href="portal.css">
<style>
  .studywrap{display:grid; grid-template-columns:290px 1fr; gap:0; height:calc(100vh - 62px)}
  .studyside{border-right:1px solid var(--line); background:var(--paper-50); overflow-y:auto; padding:16px 14px 40px}
  .studyside .home{display:block; font-family:var(--font-head); font-weight:600; color:var(--ink-900); margin-bottom:4px}
  .studyside .sub{font-size:.82rem; color:var(--ink-500); margin-bottom:12px}
  .studyside .quick{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
  .studyside .quick a{font-size:.78rem; padding:5px 9px; border:1px solid var(--line); border-radius:999px; background:var(--paper-0); color:var(--ink-700)}
  .studyside .grp{font-family:var(--font-mono); font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--blue-500); margin:16px 0 6px}
  .studyside .grp .d{color:var(--ink-500)}
  .studyside a.item{display:flex; gap:8px; padding:6px 8px; border-radius:7px; font-size:.86rem; color:var(--ink-700); line-height:1.35}
  .studyside a.item:hover{background:var(--paper-100)}
  .studyside a.item.on{background:rgba(20,80,232,.1); color:var(--blue-600); font-weight:600}
  .studyside a.item b{font-family:var(--font-mono); color:var(--ink-500); font-size:.78rem; flex:none}
  .studyside a.item.on b{color:var(--blue-500)}
  .studymain{display:flex; flex-direction:column; min-width:0}
  .studybar{display:flex; align-items:center; gap:12px; padding:8px 16px; border-bottom:1px solid var(--line); background:var(--paper-0); font-size:.82rem}
  .studybar .crumb{color:var(--ink-700); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .studybar a.ext{color:var(--blue-500); flex:none}
  .studymain iframe{flex:1; width:100%; border:0; background:#fff}
  .sideToggle{display:none}
  @media (max-width:820px){
    .studywrap{grid-template-columns:1fr; height:auto}
    .studyside{border-right:0; border-bottom:1px solid var(--line); max-height:44vh}
    .studymain iframe{height:70vh; flex:none}
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="Aizentify"></a>
    <div class="links">
      <a href="index.html">Overview</a>
      <a href="candidate.html">Candidate portal</a>
      <a href="trainer.html">Trainer console</a>
      <a href="practice.html">Practice</a>
      <a href="watch.html">Video</a>
      <a href="decks.html">Decks</a>
      <a href="study.html" class="active">Study</a>
      <a href="resources.html">Resources</a>
    </div>
  </div>
</nav>

<div class="studywrap">
  <aside class="studyside">
    <a class="home" href="study.html">Study library</a>
    <div class="sub">37 lessons &middot; 14 reference sheets &middot; an independent CCDV-F
      course by <a href="https://github.com/pjmgomez/claude-certified-developer-foundations" target="_blank" rel="noopener">pjmgomez</a>
      (Apache-2.0), hosted here. <a href="view.html?f=study/VENDORED.md">what we changed</a></div>
    <div class="quick">
      <a href="#" data-load="index.html">Course map</a>
      <a href="#" data-load="review.html">Spaced review</a>
      <a href="#" data-load="progress.html">Progress</a>
    </div>
    <div id="nav"></div>
  </aside>

  <div class="studymain">
    <div class="studybar">
      <span class="crumb" id="crumb">Pick a lesson &rarr;</span>
      <a class="ext" id="ext" href="#" target="_blank" rel="noopener" hidden>open standalone &#8599;</a>
    </div>
    <iframe id="frame" title="Study content" src="study/index.html"></iframe>
  </div>
</div>

<script src="app.js"></script>
<script>
(function () {
  var frame = document.getElementById('frame'),
      crumb = document.getElementById('crumb'),
      ext = document.getElementById('ext'),
      nav = document.getElementById('nav');
  var qp = new URLSearchParams(location.search);

  function load(path, label) {
    frame.src = 'study/' + path;
    crumb.textContent = label || path;
    ext.hidden = false; ext.href = 'study/' + path;
    history.replaceState(null, '', 'study.html?p=' + encodeURIComponent(path));
    Array.prototype.forEach.call(nav.querySelectorAll('a.item'), function (a) {
      a.classList.toggle('on', a.dataset.load === path);
    });
  }

  document.querySelectorAll('[data-load]').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); load(a.dataset.load, a.textContent.trim()); });
  });

  fetch('study/catalog.json').then(function (r) { return r.json(); }).then(function (c) {
    var byPhase = {};
    c.lessons.forEach(function (l) { (byPhase[l.phase] = byPhase[l.phase] || []).push(l); });
    Object.keys(byPhase).forEach(function (ph) {
      var day = byPhase[ph][0].day;
      var h = document.createElement('div');
      h.className = 'grp';
      h.innerHTML = ph + (day ? ' <span class="d">· ' + day + '</span>' : '');
      nav.appendChild(h);
      byPhase[ph].forEach(function (l) {
        var a = document.createElement('a');
        a.className = 'item'; a.href = '#'; a.dataset.load = l.file;
        a.innerHTML = '<b>' + String(l.n).padStart(2, '0') + '</b><span>' + l.title + '</span>';
        a.addEventListener('click', function (e) { e.preventDefault(); load(l.file, l.title); });
        nav.appendChild(a);
      });
    });
    var rh = document.createElement('div');
    rh.className = 'grp'; rh.textContent = 'Reference sheets';
    nav.appendChild(rh);
    c.references.forEach(function (r) {
      var a = document.createElement('a');
      a.className = 'item'; a.href = '#'; a.dataset.load = r.file;
      a.innerHTML = '<b>&sect;</b><span>' + r.title + '</span>';
      a.addEventListener('click', function (e) { e.preventDefault(); load(r.file, r.title); });
      nav.appendChild(a);
    });

    var p = qp.get('p');
    if (p) {
      var hit = c.lessons.concat(c.references).find(function (x) { return x.file === p; });
      load(p, hit ? hit.title : p);
    }
  }).catch(function () {
    nav.innerHTML = '<p class="note">Serve the portal over http (<code>./start.sh</code>) to load the index. ' +
      'Or open <a href="study/index.html">study/index.html</a> directly.</p>';
  });
})();
</script>
</body>
</html>
